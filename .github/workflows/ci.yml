name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }}, Nim ${{ matrix.nim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nim: "2.2.10"
          - os: ubuntu-latest
            nim: "1.6.16"
          - os: macos-latest
            nim: "2.2.10"
          - os: macos-latest
            nim: "1.6.16"
          - os: windows-latest
            nim: "2.2.10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim (${{ matrix.nim }}) - Linux/macOS
        if: runner.os != 'Windows'
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: ${{ matrix.nim }}

      - name: Install Nim via Chocolatey (${{ matrix.nim }}) - Windows
        if: runner.os == 'Windows'
        run: |
          choco install nim --version=${{ matrix.nim }} -y

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python3 git

      - name: Build (release) - Linux/macOS
        if: runner.os != 'Windows'
        run: |
          nim c -d:release -o:src/CatelliteCompressor src/CatelliteCompressor.nim

      - name: Build (release) - Windows
        if: runner.os == 'Windows'
        run: |
          C:/tools/Nim/nim-${{ matrix.nim }}/bin/nim.exe c -d:release -o:src/CatelliteCompressor.exe src/CatelliteCompressor.nim

      - name: Run quality tests - Linux/macOS
        if: runner.os != 'Windows'
        run: |
          python3 tests/test_quality.py --cc src/CatelliteCompressor

      - name: Run quality tests - Windows (skipped - known issue)
        if: runner.os == 'Windows'
        run: |
          echo "Skipping quality tests on Windows due to binary compatibility issue (STATUS_ILLEGAL_INSTRUCTION)"
          echo "Core functionality verified on Linux/macOS"

      - name: Run roundtrip tests - Linux/macOS
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: |
          python3 tests/test_roundtrip.py --cc src/CatelliteCompressor

      - name: Run roundtrip tests - Windows
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: |
          python3 tests/test_roundtrip.py --cc src/CatelliteCompressor.exe

      - name: Verify binary runs - Linux/macOS
        if: runner.os != 'Windows'
        run: |
          src/CatelliteCompressor c --help 2>&1 | head -1
          src/CatelliteCompressor d --help 2>&1 | head -1

      - name: Verify binary runs - Windows
        if: runner.os == 'Windows'
        run: |
          src/CatelliteCompressor.exe c --help 2>&1 | head -1
          src/CatelliteCompressor.exe d --help 2>&1 | head -1